  <!-- title -->
  <text x="512" y="200" text-anchor="middle" font-family="Lilita One" font-size="190" fill="#ffd34d" stroke="#2a1a10" stroke-width="30" stroke-linejoin="round" paint-order="stroke">CAPE FIX</text>
</svg>
