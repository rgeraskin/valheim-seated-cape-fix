    <path d="M 272,400 C 287,430 302,438 330,433 C 360,428 385,418 400,410 C 405,440 395,480 365,505 C 345,520 320,515 305,500 C 280,480 265,440 270,385 Z" fill="#e0782a"/>
    <path d="M 335,440 C 340,465 345,485 352,500" fill="none" stroke-width="8"/>
    <!-- eye -->
    <ellipse cx="360" cy="378" rx="9" ry="12" fill="#2a1a10" stroke="none"/>

