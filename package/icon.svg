    <path d="M 262,308 C 225,298 200,268 205,218 C 225,240 245,258 275,270 Z" fill="#f4e6c4"/>
    <path d="M 372,300 C 410,290 432,260 428,210 C 408,232 388,250 360,264 Z" fill="#f4e6c4"/>
