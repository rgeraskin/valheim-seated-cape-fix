    <path d="M 255,520 L 385,520" fill="none" stroke-width="10"/>
    <!-- arm to the tiller -->
    <path d="M 355,455 C 400,480 430,520 455,535" fill="none" stroke="#2a1a10" stroke-width="58"/>
    <path d="M 355,455 C 400,480 430,520 455,535" fill="none" stroke="#3d72b4" stroke-width="32"/>
    <!-- tiller -->
    <path d="M 175,565 L 500,520" fill="none" stroke="#2a1a10" stroke-width="40"/>
    <path d="M 175,565 L 500,520" fill="none" stroke="#9c6630" stroke-width="18"/>
    <circle cx="462" cy="533" r="26" fill="#f2c094"/>

