    <path d="M 60,770 C 110,750 150,750 200,770 C 250,790 290,790 340,770 C 390,750 430,750 480,770 C 530,790 570,790 620,770 C 670,750 710,750 760,770 C 810,790 850,790 900,770 C 930,758 950,756 975,762 L 975,850 C 950,842 930,844 900,856 C 850,876 810,876 760,856 C 710,836 670,836 620,856 C 570,876 530,876 480,856 C 430,836 390,836 340,856 C 290,876 250,876 200,856 C 150,836 110,836 60,856 Z" fill="#4aa3df"/>
