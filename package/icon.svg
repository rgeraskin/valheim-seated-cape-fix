    <path d="M 248,330 C 248,268 285,240 320,240 C 360,240 395,268 395,330 Z" fill="#b8c2cc"/>
    <path d="M 302,242 C 300,278 300,308 300,330 L 340,330 C 340,308 340,278 338,242 Z" fill="#d62f2f" stroke-width="10"/>
    <path d="M 262,278 C 268,298 270,316 270,330" fill="none" stroke="#d62f2f" stroke-width="16"/>
    <path d="M 376,276 C 370,296 368,314 368,330" fill="none" stroke="#d62f2f" stroke-width="16"/>
    <path d="M 240,323 L 403,323 L 403,348 L 240,348 Z" fill="#8d99a6"/>
    <circle cx="275" cy="335" r="5" fill="#2a1a10" stroke="none"/>
    <circle cx="322" cy="335" r="5" fill="#2a1a10" stroke="none"/>
    <circle cx="368" cy="335" r="5" fill="#2a1a10" stroke="none"/>

    <!-- stern and bow posts -->
    <path d="M 175,600 C 140,540 110,470 140,420 C 165,385 210,400 200,435 C 192,460 165,450 172,432" fill="none" stroke="#2a1a10" stroke-width="58"/>
    <path d="M 175,600 C 140,540 110,470 140,420 C 165,385 210,400 200,435 C 192,460 165,450 172,432" fill="none" stroke="#9c6630" stroke-width="32"/>
    <path d="M 860,600 C 905,540 935,460 905,405 C 880,365 830,380 838,420 C 845,450 875,445 870,425" fill="none" stroke="#2a1a10" stroke-width="58"/>
    <path d="M 860,600 C 905,540 935,460 905,405 C 880,365 830,380 838,420 C 845,450 875,445 870,425" fill="none" stroke="#9c6630" stroke-width="32"/>

    <!-- hull -->
    <path d="M 150,585 Q 515,640 885,585 C 875,700 760,800 515,805 C 280,800 160,700 150,585 Z" fill="#a8703a"/>
    <g clip-path="url(#hullclip)" fill="none" stroke="#7a4d22" stroke-width="10">
      <path d="M 140,655 Q 515,705 895,655"/>
      <path d="M 150,720 Q 515,770 885,720"/>
    </g>
    <path d="M 150,585 Q 515,640 885,585 C 875,700 760,800 515,805 C 280,800 160,700 150,585 Z" fill="none"/>
    <path d="M 160,590 Q 515,645 880,590" fill="none" stroke="#c98f52" stroke-width="10"/>


    <!-- shields on the rail -->
    <circle cx="520" cy="612" r="46" fill="#e8c14a"/>
    <circle cx="520" cy="612" r="13" fill="#9aa5b1" stroke-width="8"/>
    <circle cx="630" cy="610" r="46" fill="#d62f2f"/>
    <circle cx="630" cy="610" r="13" fill="#9aa5b1" stroke-width="8"/>
    <circle cx="740" cy="602" r="46" fill="#e8c14a"/>
    <circle cx="740" cy="602" r="13" fill="#9aa5b1" stroke-width="8"/>

    <!-- crossed out: the cape under the hull -->
    <path d="M 160,745 L 375,965 M 375,745 L 160,965" fill="none" stroke="#2a1a10" stroke-width="58"/>
    <path d="M 160,745 L 375,965 M 375,745 L 160,965" fill="none" stroke="#e02020" stroke-width="34"/>
